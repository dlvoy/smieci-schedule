    <line x1="32" y1="24" x2="32" y2="54" stroke="#4B4B4B" stroke-width="1.5" opacity="0.5" />
    <line x1="37" y1="24" x2="38" y2="54" stroke="#4B4B4B" stroke-width="1.5" opacity="0.5" />
